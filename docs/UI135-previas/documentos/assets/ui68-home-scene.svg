    <path d="M858 416h255"/><path d="M820 438h348"/><path d="M1250 386h246"/><path d="M1184 410h354"/>
  </g>
  <path d="M0 0h1600v520H0z" fill="none" stroke="#4bdded" stroke-opacity=".12" stroke-width="8"/>
