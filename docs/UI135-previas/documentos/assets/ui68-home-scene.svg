    <path d="M85 30h176v55H61L85 30Z" fill="#082437" stroke="#21768b" stroke-width="4"/>
    <rect x="111" y="0" width="104" height="31" rx="4" fill="#0a3044" stroke="#21768b" stroke-width="4"/>
